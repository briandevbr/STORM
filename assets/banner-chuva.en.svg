<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170" role="img" aria-labelledby="t">
<title id="t">STORM, Student Portal chatbot: schedule, tuition and graduation in chat. Pre-project with docs and wireframe ready.</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a1322"/><stop offset="1" stop-color="#14284a"/>
  </linearGradient>
  <clipPath id="frame"><rect width="720" height="170" rx="14"/></clipPath>
</defs>
<style>
  .drop { stroke: #7fb3ff; stroke-width: 1.6; stroke-linecap: round; animation: fall linear infinite; }
  @keyframes fall { from { transform: translate(0, -45px); } to { transform: translate(-24px, 215px); } }
  .splash { fill: none; stroke: #7fb3ff; stroke-width: 1; opacity: 0; transform-box: fill-box; transform-origin: center; animation: splash 1.4s ease-out infinite; }
  @keyframes splash { 0% { opacity: 0; transform: scale(.2); } 10% { opacity: .7; } 45% { opacity: 0; transform: scale(1.6); } 100% { opacity: 0; } }
  .c1 { fill: #1a2a45; animation: drift 16s ease-in-out infinite alternate; }
  .c2 { fill: #24375a; animation: drift 11s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
  .bolt { fill: none; stroke-linejoin: round; stroke-linecap: round; opacity: 0; }
  .b1 { animation: bolt1 7s infinite; } .b2 { animation: bolt2 7s infinite; }
  @keyframes bolt1 { 0%, 62%, 100% { opacity: 0; } 63% { opacity: 1; } 64.5% { opacity: .15; } 66% { opacity: 1; } 70% { opacity: 0; } }
  @keyframes bolt2 { 0%, 21%, 100% { opacity: 0; } 22% { opacity: .9; } 24% { opacity: 0; } }
  .flash { fill: #cfe3ff; opacity: 0; animation: flash 7s infinite; }
  @keyframes flash { 0%, 21%, 25%, 62%, 100% { opacity: 0; } 22% { opacity: .12; } 63% { opacity: .32; } 64.5% { opacity: .04; } 66% { opacity: .22; } 70% { opacity: 0; } }
  .msg { font: 700 21px 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; fill: #6AA8FF;
         stroke: #0d1b31; stroke-width: 5px; paint-order: stroke fill; opacity: 0; animation: msg 9s infinite; }
  .m2 { animation-delay: 3s; } .m3 { animation-delay: 6s; }
  @keyframes msg { 0% { opacity: 0; transform: translateY(8px); } 5% { opacity: 1; transform: translateY(0); }
                    28% { opacity: 1; transform: translateY(0); } 33% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .drop, .splash, .c1, .c2, .bolt, .flash, .msg { animation: none; }
    .m1 { opacity: 1; }
  }
</style>
